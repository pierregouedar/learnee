# Push sur main : image construite par le runner du NAS, poussée dans le registre Forgejo, puis Coolify redéploie.
# Secrets du dépôt : REGISTRY_TOKEN (jeton Forgejo, scope write:package), COOLIFY_TOKEN (jeton API Coolify, permission deploy).
# Variable du dépôt : COOLIFY_APP_UUID (UUID de l'application dans Coolify).
name: deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: docker
    env:
      IMAGE: banane.tailcddc99.ts.net:3000/${{ forgejo.repository }}
    steps:
      - name: Récupérer le code
        run: git clone --depth 1 --branch "$FORGEJO_REF_NAME" "https://oauth2:${FORGEJO_TOKEN}@banane.tailcddc99.ts.net:3000/${FORGEJO_REPOSITORY}.git" .

      - name: Tests
        run: docker build --target build -t learnee-test . && docker run --rm learnee-test pnpm test

      - name: Construire et pousser l'image
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login banane.tailcddc99.ts.net:3000 -u "$FORGEJO_REPOSITORY_OWNER" --password-stdin
          docker build -t "$IMAGE:$FORGEJO_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$FORGEJO_SHA"
          docker push "$IMAGE:latest"

      - name: Redéployer dans Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: wget -q -O - --header "Authorization: Bearer $COOLIFY_TOKEN" --post-data "" "https://banane.tailcddc99.ts.net:8000/api/v1/deploy?uuid=${{ vars.COOLIFY_APP_UUID }}"
